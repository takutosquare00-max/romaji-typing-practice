<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#000000">
  <title>にほんごタイピング</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      font-size: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 16px 12px;
      max-height: 50vh;
      max-height: 50dvh;
      overflow-y: auto;
    }

    header {
      text-align: center;
      padding: 8px 0 12px;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.02em;
    }
    header h1 ruby { ruby-position: over; ruby-align: center; }
    header h1 rt { font-size: 0.5em; line-height: 1; }
    header .subtitle {
      font-size: 0.75rem;
      color: #8e8e93;
      margin-top: 2px;
      font-weight: 400;
    }

    .card {
      background: #000;
      border-radius: 10px;
      padding: 10px 16px 12px;
      margin-bottom: 8px;
    }

    .sentence-display {
      font-size: 1.35rem;
      line-height: 1.35;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px 8px;
      color: #fff;
      width: 100%;
      box-sizing: border-box;
      font-weight: 400;
    }
    .sentence-display .sentence-inner {
      max-width: 100%;
      text-align: center;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    @media (min-width: 480px) and (min-height: 600px) {
      .sentence-display { font-size: 1.65rem; min-height: 3.5em; padding: 8px 12px; }
    }

    .romaji-display {
      margin-top: 8px;
      padding: 12px 14px;
      background: #1c1c1e;
      border-radius: 8px;
      border: none;
      font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
      font-size: 0.9375rem;
      line-height: 1.7;
      min-height: 2.5em;
      text-align: center;
      letter-spacing: 0.03em;
    }
    @media (min-width: 480px) and (min-height: 600px) {
      .romaji-display { font-size: 1rem; padding: 14px 16px; }
    }
    .romaji-display .char {
      display: inline;
    }
    .romaji-display .char.correct {
      color: #30d158;
    }
    .romaji-display .char.wrong {
      color: #ff453a;
    }
    .romaji-display .char.current {
      color: #1c1c1e;
    }
    .romaji-display .char.remaining {
      color: #1c1c1e;
    }
    .romaji-display .char.space {
      display: inline;
    }
    .romaji-wrapper {
      position: relative;
      margin-top: 8px;
      cursor: text;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(255,255,255,0.1);
    }
    .romaji-wrapper .romaji-display {
      margin-top: 0;
    }
    .typing-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      min-height: 48px;
      opacity: 0;
      cursor: text;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      min-height: 44px;
      padding: 0 20px;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active {
      opacity: 0.7;
    }
    .btn-primary {
      background: #0a84ff;
      color: #fff;
    }
    .btn-secondary {
      background: #2c2c2e;
      color: #fff;
    }
    .btn-secondary:active {
      background: #3a3a3c;
    }
    .btn-icon {
      flex: 0 0 auto;
      width: 34px;
      min-height: 30px;
      padding: 0;
      border-radius: 7px;
      font-size: 0.8125rem;
      line-height: 1;
      margin-left: auto;
    }

    .mode-toggle {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .mode-toggle-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .stats-inline {
      font-size: 0.875rem;
      color: #8e8e93;
      font-variant-numeric: tabular-nums;
    }
    .stats-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex: 0 0 auto;
    }
    .stats-inline ruby { ruby-position: over; ruby-align: center; }
    .stats-inline rt { font-size: 0.5em; line-height: 1; }
    .mode-toggle label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: #8e8e93;
      cursor: pointer;
    }
    .mode-toggle input {
      width: 18px;
      height: 18px;
      accent-color: #0a84ff;
    }

    /* 助詞練習: 助詞を空欄で出し、入力し終えたら色付きで見せる */
    .sentence-display mark {
      background: none;
      color: inherit;
    }
    .sentence-display.particle-quiz mark {
      display: inline-block;
      min-width: 1.6em;
      margin: 0 0.1em;
      color: transparent;
      border-bottom: 2px solid #0a84ff;
      line-height: 1.1;
    }
    .sentence-display.particle-quiz.revealed mark {
      color: #ffd60a;
      border-bottom-color: #ffd60a;
    }

    .sentence-display ruby {
      ruby-position: over;
      ruby-align: center;
    }
    .sentence-display rt {
      font-size: 0.65em;
      line-height: 0.9;
      user-select: none;
    }

    .feedback {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: rgba(48, 209, 88, 0.15);
      color: #30d158;
    }
    .feedback.wrong {
      background: rgba(255, 69, 58, 0.12);
      color: #ff453a;
    }
    .feedback .expected {
      font-family: "SF Mono", Menlo, monospace;
      margin-top: 6px;
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .result-panel {
      text-align: center;
      padding: 20px 16px;
      display: none;
    }
    .result-panel.show { display: block; }
    .result-panel h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }
    .result-panel p {
      font-size: 0.875rem;
      color: #8e8e93;
      margin: 0;
    }
    .result-score {
      font-size: 2rem;
      font-weight: 600;
      margin: 10px 0;
      letter-spacing: -0.02em;
    }
    .result-score.good { color: #30d158; }
    .result-score.fair { color: #ffd60a; }
    .result-score.poor { color: #ff453a; }

    @media (min-width: 480px) and (min-height: 600px) {
      .container {
        padding: 16px 20px 20px;
        max-height: 55vh;
        max-height: 55dvh;
      }
      header { padding: 16px 0 20px; }
      header h1 { font-size: 1.25rem; }
      header .subtitle { font-size: 0.8125rem; margin-top: 4px; }
      .card { padding: 12px 20px 16px; margin-bottom: 12px; }
      .mode-toggle { margin-bottom: 12px; }
      .btn-row { margin-top: 12px; }
      .btn { min-height: 44px; }
      .btn-icon { width: 36px; min-height: 32px; }
      .feedback { margin-top: 12px; padding: 12px 16px; }
      .result-panel { padding: 32px 24px; }
      .result-panel h2 { font-size: 1.25rem; margin-bottom: 24px; }
      .result-score { font-size: 2.5rem; margin: 16px 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>にほんごタイピング</h1>
      <p class="subtitle">Japanese Typing</p>
    </header>

    <div class="card" id="practiceCard">
      <div class="mode-toggle">
        <div class="mode-toggle-options">
          <label><input type="radio" name="furiganaMode" value="on" checked> ふりがなあり</label>
          <label><input type="radio" name="furiganaMode" value="off"> ふりがななし</label>
          <label><input type="checkbox" id="particleMode"> 助詞</label>
        </div>
        <div class="stats-actions">
          <span class="stats-inline"><ruby>正解<rt>せいかい</rt></ruby>: <span id="correctCount">0</span>/<span id="totalCount">0</span></span>
          <button type="button" class="btn btn-secondary btn-icon" id="btnSkip" aria-label="スキップ" title="スキップ">&gt;&gt;</button>
        </div>
      </div>

      <div class="sentence-display" id="sentenceDisplay">
        （読み込み中…）
      </div>

      <div class="romaji-wrapper">
        <div class="romaji-display" id="romajiDisplay" tabindex="0" contenteditable="false"
          role="application" aria-label="ローマ字入力エリア" lang="en">
          （ここをクリックして入力開始）
        </div>
        <input type="text" id="typingInput" class="typing-input" tabindex="0" autocomplete="off" autocapitalize="off"
          autocorrect="off" spellcheck="false" inputmode="latin" lang="en"
          aria-label="ローマ字入力">
      </div>

      <div class="feedback" id="feedback"></div>
    </div>

    <div class="result-panel" id="resultPanel">
      <h2>おつかれさまでした！</h2>
      <p>正解数</p>
      <div class="result-score" id="resultScore">0</div>
      <p>問 / <span id="resultTotal">0</span> 問</p>
      <div class="btn-row" style="margin-top: 24px;">
        <button type="button" class="btn btn-primary" id="btnRestart">もう一度</button>
      </div>
    </div>
  </div>

      var MODE_STORAGE_KEY = 'romajiTyping.displayMode';
      var particleToggle = document.getElementById('particleMode');
      // 「助詞」はふりがなあり／なしと組み合わせて使う（オンで助詞を空欄にした穴埋め）
      function isParticleOn() {
        return !!(particleToggle && particleToggle.checked);
      }
      function restoreDisplayMode() {
        var saved = null;
        try { saved = localStorage.getItem(MODE_STORAGE_KEY); } catch (e) {}
        if (!saved) return;
        var mode = null;
        try { mode = JSON.parse(saved); } catch (e) {}
        if (!mode || typeof mode !== 'object') {
          // 旧形式（'on' / 'off' / 'particle' の文字列）
          mode = { furigana: saved === 'on', particle: saved === 'particle' };
        }
        var r = document.querySelector('input[name="furiganaMode"][value="' + (mode.furigana ? 'on' : 'off') + '"]');
        if (r) r.checked = true;
        if (particleToggle) particleToggle.checked = !!mode.particle;
      }
      function saveDisplayMode() {
        try {
          localStorage.setItem(MODE_STORAGE_KEY, JSON.stringify({ furigana: isFuriganaOn(), particle: isParticleOn() }));
        } catch (e) {}
      }

      function loadSentences() {
        var data = FALLBACK_DATA;
        var usedFallback = false;
        try {
          var el = document.getElementById('sentences-json-particles');
          if (el && el.textContent) {
            var parsed = JSON.parse(el.textContent);
            if (Array.isArray(parsed) && parsed.length > 0) data = parsed;
            else usedFallback = true;
          } else {
            usedFallback = true;
          }
        } catch (e) {
          usedFallback = true;
        }
        if (usedFallback) {
          pushStartupWarning('データ読込失敗: 簡易データ');
        }
        sentences = data.map(prepareSentence).filter(Boolean);
        if (sentences.length === 0 && data !== FALLBACK_DATA) {
          pushStartupWarning('データ形式不正: 簡易データ');
          sentences = FALLBACK_DATA.map(prepareSentence).filter(Boolean);
        }
        showStartupWarnings();
        filterAndShuffle();
      }

      function filterAndShuffle() {
        filtered = sentences.slice();
        for (var i = filtered.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = filtered[i]; filtered[i] = filtered[j]; filtered[j] = t;
        }
        currentIndex = 0;
        correctCount = 0;
        answeredCount = 0;
        updateStats();
      }

      function getCurrent() { return filtered[currentIndex]; }

      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function kataToHira(s) {
        return String(s || '').replace(/[\u30a1-\u30f6]/g, function(ch) {
          return String.fromCharCode(ch.charCodeAt(0) - 0x60);
        });
      }

      function rubyHtmlToReading(rawHtml, fallbackText) {
        if (!rawHtml) return kataToHira(fallbackText || '');
        var template = document.createElement('template');
        template.innerHTML = String(rawHtml);
        function readNode(node) {
          if (!node) return '';
          if (node.nodeType === 3) return node.nodeValue || '';
          if (node.nodeType !== 1) return '';
          var tag = String(node.tagName || '').toUpperCase();
          if (tag === 'RT' || tag === 'RP') return '';
          if (tag === 'RUBY') {
            var rt = node.querySelector('rt');
            if (rt && rt.textContent) return rt.textContent;
          }
          var out = '';
          var children = Array.prototype.slice.call(node.childNodes || []);
          for (var i = 0; i < children.length; i++) out += readNode(children[i]);
          return out;
        }
        var reading = '';
        var roots = Array.prototype.slice.call(template.content.childNodes || []);
        for (var i = 0; i < roots.length; i++) reading += readNode(roots[i]);
        return kataToHira(reading || fallbackText || '').replace(/。/g, '').trim();
      }

      var KANA_ROMAJI = {
        'あ': ['a'], 'い': ['i'], 'う': ['u'], 'え': ['e'], 'お': ['o'],
        'か': ['ka'], 'き': ['ki'], 'く': ['ku'], 'け': ['ke'], 'こ': ['ko'],
        'さ': ['sa'], 'し': ['si'], 'す': ['su'], 'せ': ['se'], 'そ': ['so'],
        'た': ['ta'], 'ち': ['ti'], 'つ': ['tu'], 'て': ['te'], 'と': ['to'],
        'な': ['na'], 'に': ['ni'], 'ぬ': ['nu'], 'ね': ['ne'], 'の': ['no'],
        'は': ['ha'], 'ひ': ['hi'], 'ふ': ['hu'], 'へ': ['he'], 'ほ': ['ho'],
        'ま': ['ma'], 'み': ['mi'], 'む': ['mu'], 'め': ['me'], 'も': ['mo'],
        'や': ['ya'], 'ゆ': ['yu'], 'よ': ['yo'],
        'ら': ['ra'], 'り': ['ri'], 'る': ['ru'], 'れ': ['re'], 'ろ': ['ro'],
        'わ': ['wa'], 'を': ['wo'], 'ん': ['n'],
        'が': ['ga'], 'ぎ': ['gi'], 'ぐ': ['gu'], 'げ': ['ge'], 'ご': ['go'],
        'ざ': ['za'], 'じ': ['zi'], 'ず': ['zu'], 'ぜ': ['ze'], 'ぞ': ['zo'],
        'だ': ['da'], 'ぢ': ['zi'], 'づ': ['zu'], 'で': ['de'], 'ど': ['do'],
        'ば': ['ba'], 'び': ['bi'], 'ぶ': ['bu'], 'べ': ['be'], 'ぼ': ['bo'],
        'ぱ': ['pa'], 'ぴ': ['pi'], 'ぷ': ['pu'], 'ぺ': ['pe'], 'ぽ': ['po'],
        'ぁ': ['a'], 'ぃ': ['i'], 'ぅ': ['u'], 'ぇ': ['e'], 'ぉ': ['o'],
        'ゔ': ['vu']
      };
      var YOON_ROMAJI = {
        'きゃ': ['kya'], 'きゅ': ['kyu'], 'きょ': ['kyo'],
        'しゃ': ['sya'], 'しゅ': ['syu'], 'しょ': ['syo'],
        'ちゃ': ['tya'], 'ちゅ': ['tyu'], 'ちょ': ['tyo'],
        'にゃ': ['nya'], 'にゅ': ['nyu'], 'にょ': ['nyo'],
        'ひゃ': ['hya'], 'ひゅ': ['hyu'], 'ひょ': ['hyo'],
        'みゃ': ['mya'], 'みゅ': ['myu'], 'みょ': ['myo'],
        'りゃ': ['rya'], 'りゅ': ['ryu'], 'りょ': ['ryo'],
        'ぎゃ': ['gya'], 'ぎゅ': ['gyu'], 'ぎょ': ['gyo'],
        'じゃ': ['zya'], 'じゅ': ['zyu'], 'じょ': ['zyo'],
        'びゃ': ['bya'], 'びゅ': ['byu'], 'びょ': ['byo'],
        'ぴゃ': ['pya'], 'ぴゅ': ['pyu'], 'ぴょ': ['pyo'],
        'てぃ': ['thi']
      };

      function displayCharsByNorm(displayStr) {
        return String(displayStr || '').replace(/\s/g, '').split('');
      }

      function chooseRomajiLength(candidates, expected, pos) {
        for (var i = 0; i < candidates.length; i++) {
          var candidate = candidates[i];
          if (expected.slice(pos, pos + candidate.length) === candidate) return candidate.length;
        }
        return candidates.length ? candidates[0].length : 1;
      }

      function buildKanaSegments(kanaText, expected, displayStr) {
        var kana = String(kanaText || '').replace(/。/g, '');
        var displayChars = displayCharsByNorm(displayStr);
        var segments = [];
        var pos = 0;
        function displaySlice(start, end) {
          var text = displayChars.slice(start, end).join('');
          return text || expected.slice(start, end);
        }
        for (var i = 0; i < kana.length; i++) {
          var ch = kana[i];
          if (/\s/.test(ch)) {
            segments.push({ kana: ch, romaji: '', start: pos, end: pos, space: true });
            continue;
          }
          var pair = kana.slice(i, i + 2);
          if (YOON_ROMAJI[pair]) {
            var pairLen = chooseRomajiLength(YOON_ROMAJI[pair], expected, pos);
            segments.push({ kana: pair, romaji: displaySlice(pos, pos + pairLen), start: pos, end: pos + pairLen });
            pos += pairLen;
            i++;
            continue;
          }
          var len = 1;
          if (ch === 'っ') {
            len = pos < expected.length ? 1 : 0;
          } else if (ch === 'ー') {
            len = pos < expected.length ? 1 : 0;
          } else {
            len = chooseRomajiLength(KANA_ROMAJI[ch] || [expected[pos] || ''], expected, pos);
          }
          segments.push({ kana: ch, romaji: displaySlice(pos, pos + len), start: pos, end: pos + len });
          pos += len;
        }
        return segments;
      }

      function buildRomajiSpans(displayStr) {
        var html = '';
        for (var i = 0; i < displayStr.length; i++) {
          var c = displayStr[i];
          var cls = 'char';
          if (c === ' ') cls += ' space';
          else cls += ' remaining';
          html += '<span class="' + cls + '" data-idx="' + i + '">' + escapeHtml(c) + '</span>';
        }
        return html;
      }

      function getExpectedPos(userTyped, expected) {
        var expectedPos = 0;
        for (var ui = 0; ui < userTyped.length; ui++) {
          var uc = userTyped[ui];
          if (expectedPos < expected.length && uc === expected[expectedPos]) {
            expectedPos++;
          }
        }
        return expectedPos;
      }

      function buildProgressiveKanaSpans(s, expectedPos) {
        if (!s.segments || !s.segments.length) return '';
        var html = '';
        for (var i = 0; i < s.segments.length; i++) {
          var seg = s.segments[i];
          if (seg.space) {
            html += '<span class="char space"> </span>';
            continue;
          }
          if (expectedPos >= seg.end) {
            html += '<span class="char correct">' + escapeHtml(seg.kana) + '</span>';
            continue;
          }
          var romaji = seg.romaji || '';
          for (var j = 0; j < romaji.length; j++) {
            var globalIdx = seg.start + j;
            var cls = 'char';
            if (globalIdx < expectedPos) cls += ' correct';
            else if (globalIdx === expectedPos) cls += ' current';
            else cls += ' remaining';
            html += '<span class="' + cls + '">' + escapeHtml(romaji[j]) + '</span>';
          }
        }
        return html;
      }

      function updateRomajiDisplay() {
        var s = getCurrent();
        if (!s || !s._display) return;
        var userTyped = normalizeForCompare(typingInput.value);
        var expected = s._norm;
        var displayStr = s._display;
        var expectedPos = getExpectedPos(userTyped, expected);

        if (userTyped === expected && s.kana) {
          romajiDisplay.innerHTML = '<span class="char correct">' + escapeHtml(s.kana) + '</span>';
          return;
        }

        if (s.segments && s.segments.length) {
          romajiDisplay.innerHTML = buildProgressiveKanaSpans(s, expectedPos);
          return;
        }

        var html = '';
        var normIdx = 0;
        for (var i = 0; i < displayStr.length; i++) {
          var c = displayStr[i];
          if (c === ' ') {
            html += '<span class="char space"> </span>';
            continue;
          }
          var cls = 'char';
          if (normIdx < expectedPos) cls += ' correct';
          else if (normIdx === expectedPos) cls += ' current';
          else cls += ' remaining';
          html += '<span class="' + cls + '">' + escapeHtml(c) + '</span>';
          normIdx++;
        }
        romajiDisplay.innerHTML = html;
      }

      function showCurrent() {
        if (filtered.length === 0) {
          display.innerHTML = '<span class="sentence-inner">問題がありません。</span>';
          romajiDisplay.innerHTML = '';
          return;
        }
        var s = getCurrent();
        if (!s) { showResult(); return; }
        display.classList.remove('revealed');
        display.classList.toggle('particle-quiz', isParticleOn());
        if (isFuriganaOn() && s.furigana) {
          display.innerHTML = '<span class="sentence-inner">' + s.furigana + '</span>';
        } else if (s.markedPlain) {
          display.innerHTML = '<span class="sentence-inner">' + s.markedPlain + '</span>';
        } else {
          display.innerHTML = '<span class="sentence-inner">' + escapeHtml(s.ja) + '</span>';
        }
        romajiDisplay.innerHTML = buildRomajiSpans(s._display);
        typingInput.value = '';
        feedback.className = 'feedback';
        feedback.textContent = '';
        updateRomajiDisplay();
        try { typingInput.focus(); } catch (e) {}
      }

      function updateStats() {
        if (correctCountEl) correctCountEl.textContent = correctCount;
        if (totalCountEl) totalCountEl.textContent = answeredCount;
      }

      function showResult() {
        practiceCard.style.display = 'none';
        resultPanel.classList.add('show');
        var total = filtered.length;
        var totalEl = document.getElementById('resultTotal');
        var scoreEl = document.getElementById('resultScore');
        if (totalEl) totalEl.textContent = total;
        if (scoreEl) {
          scoreEl.textContent = correctCount;
          scoreEl.className = 'result-score ' + (correctCount === total ? 'good' : correctCount >= total * 0.7 ? 'fair' : 'poor');
        }
      }

      var advancing = false;
      function advanceToNext() {
        advancing = false;
        currentIndex++;
        (currentIndex >= filtered.length) ? showResult() : showCurrent();
      }

      function waitForNextKey() {
        advancing = true;
        display.classList.add('revealed');
        feedback.className = 'feedback';
        feedback.textContent = '';
        updateStats();
        updateRomajiDisplay();
      }

      function onTypingInput() {
        var s = getCurrent();
        if (!s || advancing) return;
        var userTyped = normalizeForCompare(typingInput.value);
        var expected = s._norm;
        var expectedPos = getExpectedPos(userTyped, expected);

        if (userTyped === expected) {
          answeredCount++;
          correctCount++;
          waitForNextKey();
          return;
        }

        if (expectedPos >= expected.length) {
          answeredCount++;
          waitForNextKey();
          return;
        }

        updateRomajiDisplay();
      }

      function skip() {
        if (advancing) {
          advanceToNext();
          return;
        }
        var s = getCurrent();
        if (!s) return;
        answeredCount++;
        feedback.className = 'feedback';
        feedback.textContent = '';
        updateStats();
        advanceToNext();
      }

      var romajiWrapper = document.querySelector('.romaji-wrapper');
      if (romajiWrapper) {
        romajiWrapper.addEventListener('click', function() {
          typingInput.focus();
        });
      }
      typingInput.addEventListener('input', function(e) {
        if (e.isComposing) return;
        onTypingInput();
      });
      typingInput.addEventListener('compositionend', onTypingInput);
      typingInput.addEventListener('paste', function(e) { e.preventDefault(); });
      typingInput.addEventListener('keydown', function(e) {
        if (e.isComposing) return;
        if (advancing && (e.code === 'Enter' || e.code === 'Space')) {
          e.preventDefault();
          advanceToNext();
          return;
        }
        if (e.code === 'Enter') {
          e.preventDefault();
          skip();
        }
      });
      var btnSkip = document.getElementById('btnSkip');
      if (btnSkip) btnSkip.addEventListener('click', skip);
      var btnRestart = document.getElementById('btnRestart');
      if (btnRestart) {
        btnRestart.addEventListener('click', function() {
          resultPanel.classList.remove('show');
          practiceCard.style.display = 'block';
          filterAndShuffle();
          showCurrent();
        });
      }

      var modeRadios = document.querySelectorAll('input[name="furiganaMode"]');
      for (var i = 0; i < modeRadios.length; i++) {
        modeRadios[i].addEventListener('change', function() { saveDisplayMode(); showCurrent(); });
      }
      if (particleToggle) {
        particleToggle.addEventListener('change', function() { saveDisplayMode(); showCurrent(); });
      }

      restoreDisplayMode();
      loadSentences();
      if (filtered.length) showCurrent();
    })();
  </script>
</body>
</html>
